name: home-brain

# Production: the vault on the NAS over NFS, GitHub login, reached through the Cloudflare Tunnel.
# All site-specific values come from .env (see .env.example); docs/deploy.md walks through setup.

services:
  home-brain:
    image: ghcr.io/bjornerikmoen2/home-brain:latest
    container_name: home-brain
    # Must be able to write the NFS share; match the owner of the NAS dataset.
    user: "${HOME_BRAIN_UID:-1000}:${HOME_BRAIN_GID:-1000}"
    environment:
      TZ: Europe/Oslo
      VAULT_PATH: /vault
      DATA_PATH: /data
      PUBLIC_URL: ${PUBLIC_URL}
      AUTH_PROVIDER: github
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ALLOWED_USERS: ${ALLOWED_USERS}
      # Push notifications; off while NTFY_URL is empty (docs/deploy.md, step 6).
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-home-brain}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      BRIEFING_TIME: ${BRIEFING_TIME:-19:00}
      # Chores from Home-Board; off while HOMEBOARD_URL is empty (docs/deploy.md, step 7).
      HOMEBOARD_URL: ${HOMEBOARD_URL:-}
      HOMEBOARD_API_KEY: ${HOMEBOARD_API_KEY:-}
      # Calendar events (e.g. Google Calendar); off while empty (docs/deploy.md, step 8).
      CALENDAR_URLS: ${CALENDAR_URLS:-}
    volumes:
      # nocopy: otherwise Docker tries to chown the empty NFS share to the image's UID on first
      # use, which the NAS refuses (or which would leave the wrong owner).
      - type: volume
        source: vault
        target: /vault
        volume:
          nocopy: true
      - home-brain-data:/data
    ports:
      # Localhost only, for health checks on the host. The tunnel reaches the container over the
      # proxy network, and ports published on all interfaces would bypass the host firewall.
      - "127.0.0.1:${HOME_BRAIN_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - proxy

  ntfy:
    # Push notification server for the phone app; reached through the tunnel as ntfy.<domain>.
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    environment:
      TZ: Europe/Oslo
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:?set NTFY_PUBLIC_URL in .env, see .env.example}
      # Instant delivery on iOS goes through ntfy.sh, which only sees a message ID, not the text.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # Nobody can read or publish without a login or token.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
    volumes:
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - proxy

volumes:
  vault:
    # Compose creates this once; after changing NAS_* run `docker volume rm home-brain-vault`.
    name: home-brain-vault
    driver: local
    driver_opts:
      type: nfs
      # NFSv3 works on TrueNAS CORE and SCALE without extra settings; set NAS_NFS_VERSION=4.1 if NFSv4 is enabled.
      o: "addr=${NAS_ADDRESS},rw,nfsvers=${NAS_NFS_VERSION:-3},hard,timeo=600"
      device: ":${NAS_VAULT_EXPORT}"
  home-brain-data:
    # Search index, login state and the record of sent notifications. Local disk only: SQLite
    # must not live on NFS.
    name: home-brain-data
  ntfy-data:
    # ntfy's users, tokens and message cache.
    name: ntfy-data

networks:
  proxy:
    external: true

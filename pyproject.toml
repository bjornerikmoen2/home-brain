[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "home-brain"
version = "0.1.0"
description = "Self-hosted personal assistant: a markdown knowledge vault exposed to Claude as an MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "icalendar>=6",
    "pypdf[crypto]>=6,<7",
    "python-dateutil>=2.9",
    "recurring-ical-events>=3.3",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
home-brain = "home_brain.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/home_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
